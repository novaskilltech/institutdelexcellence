name: Publier les nouveaux ouvrages

on:
  push:
    branches: [main]
    paths:
      - 'nouveaux-livres/a-publier/**'
      - 'livres.json'
      - 'build.py'
      - 'ingest.py'
  workflow_dispatch:
    inputs:
      site_url:
        description: 'URL publique du site (ex: https://institutdelexcellence.vercel.app)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-and-publish:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ github.event.inputs.site_url || vars.SITE_URL || 'https://institutdelexcellence.vercel.app' }}

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer PyMuPDF et Pillow (dans le cloud uniquement)
        run: python -m pip install --no-cache-dir pymupdf pillow

      - name: Ingérer les nouveaux PDF depuis nouveaux-livres/a-publier
        run: python ingest.py

      - name: Générer le site statique, les couvertures et les images OpenGraph
        run: |
          if [ -n "$SITE_URL" ]; then
            python build.py --site-url "$SITE_URL"
          else
            python build.py
          fi

      - name: Publier les fichiers générés sur main
        run: |
          git config user.name "Institut Excellence Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            exit 0
          fi
          git commit -m "Publication automatique des ouvrages [skip ci]"
          git pull --rebase origin main
          git push origin main
